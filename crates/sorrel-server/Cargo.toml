[package]
name = "sorrel-server"
version = "0.1.0"
edition = "2024"

[dependencies]
sorrel-api = { path = "../sorrel-api", features = ["axum"] }

anyhow = "1.0.100"
axum = { version = "0.8.7", features = ["macros"] }
axum-client-ip = "1.3.1"
base64 = "0.22.1"
env_logger = "0.11.8"
figment = { version = "0.10.19", features = ["env", "toml"] }
hmac = "0.12.1"
log = "0.4.29"
maud = { version = "0.27.0", features = ["axum"] }
monostate = "1.0.2"
openidconnect = { version = "4.0.1" }
rand = "0.8.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_with = { version = "3.16.1", features = ["hex"] }
sha2 = "0.10.9"
snafu = "0.8.9"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "tls-rustls", "uuid"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tower-sessions = "0.14.0"
uuid = { version = "1.20.0", features = ["serde", "v4"] }
