[package]
name = "iroh-keyserver-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
iroh-oidc = { path = "../iroh-oidc" }

anyhow = "1.0.101"
axum = "0.8.8"
base64 = "0.22.1"
clap = { version = "4.5.56", features = ["derive"] }
env_logger = "0.11.8"
figment = { version = "0.10.19", features = ["env"] }
log = "0.4.29"
rand = "0.8.5"
reqwest = { version = "0.13.2", features = ["form", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
url = "2.5.8"
webbrowser = "1.1.0"
serde_json = "1.0.149"
